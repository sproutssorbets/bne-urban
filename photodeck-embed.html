<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PHOTOINDEX - Spatial Database</title>
<link rel="preconnect" href="https://api.mapbox.com">
<link rel="preconnect" href="https://raw.githubusercontent.com">
<style>
  :root {
    --bg: #FFFFFF;
    --panel: #FAFAFA;
    --line: #DADADA;
    --line-light: #EAEAEA;
    --text: #111111;
    --subtext: #6B6B6B;
  }
  *, *::before, *::after {
    box-sizing: border-box; margin: 0; padding: 0;
    border-radius: 0 !important; box-shadow: none !important;
    -webkit-tap-highlight-color: transparent;
  }
  :focus-visible { outline: 1px solid var(--text) !important; outline-offset: -1px; }
  html, body {
    width: 100%; height: 100%; height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }
  body.pi-drawer-lock { overflow: hidden; }
  #topbar { background: var(--bg); flex-shrink: 0; z-index: 10; border-bottom: 1px solid var(--text); }
  #search-row { display: flex; align-items: center; height: 42px; padding: 0 16px; gap: 12px; background: var(--bg); }
  .search-lead-icon { width: 14px; height: 14px; flex-shrink: 0; stroke: var(--text); }
  #geocoder { flex: 1; height: 100%; position: relative; }
  #pi-search-wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; }
  #pi-search-input { width: 100%; height: 100%; border: none; background: transparent; font-family: inherit; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text); outline: none; }
  #pi-search-input::placeholder { color: var(--subtext); font-weight: 400; }
  #pi-search-clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: none; background: transparent; font-size: 20px; color: var(--text); cursor: pointer; display: none; line-height: 1; padding: 4px 8px; }
  #search-archive-btn { height: 100%; padding: 0 4px; border: none; background: transparent; color: var(--text); font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; text-decoration: none; flex-shrink: 0; }
  #context-bar {
    display: flex; align-items: center; height: 32px; padding: 0 18px;
    font-size: 9px; color: var(--subtext); letter-spacing: 0.1em;
    background: var(--bg); text-transform: uppercase; border-top: 1px solid var(--line-light);
    font-weight: 500;
  }
  #layout { width: 100%; flex: 1 1 auto; min-height: 0; background: var(--bg); position: relative; display: flex; overflow: hidden; margin: 0; padding: 0; }
  #index-panel { width: 320px; flex-shrink: 0; position: relative; height: 100%; border-right: 1px solid var(--text); display: flex; flex-direction: column; background: var(--bg); z-index: 3; overflow-y: auto; }
  .mobile-only-header { display: none; }
  .mobile-grip { display: none; }
  .acc-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line-light); cursor: pointer; user-select: none; background: var(--bg); flex-shrink: 0; }
  .acc-head:hover { background: var(--panel); }
  .acc-title { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text); }
  .acc-count { font-size: 9px; font-weight: 500; color: var(--subtext); margin-left: 6px; }
  .acc-icon { font-size: 14px; font-weight: 300; color: var(--text); line-height: 1; transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
  .acc-head.open .acc-icon { transform: rotate(45deg); }
  .acc-body { display: none; padding: 12px 18px 18px; border-bottom: 1px solid var(--line-light); font-size: 12px; color: var(--text); background: var(--bg); }
  .acc-body.open { display: block; }
  .sub-category-title { font-size: 9px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--subtext); margin: 14px 0 6px 0; }
  .sub-category-title:first-child { margin-top: 0; }
  .acc-body label { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 6px 0; font-size: 12px; letter-spacing: 0.02em; color: #444444; }
  .acc-body label:hover { color: #000000; }
  .acc-body label.no-data { opacity: 0.4; cursor: default; }
  .filter-count { margin-left: auto; font-size: 11px; color: var(--subtext); }
  .acc-body input[type="checkbox"], .acc-body input[type="radio"] { -webkit-appearance: none; appearance: none; margin: 0; width: 12px; height: 12px; border: 1px solid var(--text); background: var(--bg); display: grid; place-content: center; flex-shrink: 0; }
  .acc-body input[type="radio"]:checked::before { content: ""; width: 6px; height: 6px; background: var(--text); }
  .acc-body input[type="checkbox"]:checked { background: var(--text); }
  #filters-group { flex-shrink: 0; }
  #index-group { display: flex; flex-direction: column; flex: none; min-height: 0; }
  .index-group-head { padding: 14px 18px; border-bottom: 1px solid var(--text); background: var(--bg); flex-shrink: 0; }
  #list-wrap { flex: none; overflow-y: visible; }
  .list-row { padding: 12px 18px; border-bottom: 1px solid var(--line-light); cursor: pointer; background: var(--bg); }
  .list-row:hover { background: var(--text); }
  .list-row:hover .list-street, .list-row:hover .list-suburb { color: #FFFFFF; }
  .list-street { font-size: 12px; font-weight: 500; text-transform: uppercase; }
  .list-suburb { font-size: 10px; color: var(--subtext); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.06em; }
  .list-empty { padding: 16px 18px; font-size: 11px; color: var(--subtext); }
  #pi-footer { padding: 16px 18px; background: var(--bg); border-top: 1px solid var(--text); flex-shrink: 0; }
  .pi-footer-stat { font-size: 9px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text); margin-top: 10px; }
  #map-wrap { flex: 1; position: relative; height: 100%; background: #F8F8F8; margin: 0; padding: 0; }
  #map { position: absolute; inset: 0; opacity: 0; transition: opacity 0.3s ease-in-out; }
  #map.loaded { opacity: 1; }
  #map-error {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: #F8F8F8; text-align: center; padding: 40px; z-index: 5;
  }
  #map-error.visible { display: flex; }
  #map-error-text { font-size: 11px; letter-spacing: 0.06em; color: var(--subtext); max-width: 320px; line-height: 1.6; }
  .custom-marker-hitbox {
    width: 36px; height: 44px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    cursor: pointer;
    transform: translate3d(0,0,0);
    will-change: transform;
    contain: layout style;
  }
  .pi-pin { display: flex; flex-direction: column; align-items: center; }
  .pi-pin-body { min-width: 22px; height: 22px; padding: 0 5px; background: var(--text); color: #FFFFFF; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .pi-pin-point { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 4px solid var(--text); }
  .custom-marker-hitbox:hover .pi-pin-body { background: #FFFFFF; color: var(--text); outline: 1px solid var(--text); }
  .pi-popup .mapboxgl-popup-content {
    background: var(--bg); border: 1px solid var(--text); padding: 16px;
    font-family: inherit; position: relative;
  }
  .pi-popup .mapboxgl-popup-close-button {
    position: absolute; top: 12px; right: 12px; font-size: 16px; color: var(--text);
    border: none; background: transparent; cursor: pointer; line-height: 1; padding: 4px; z-index: 10;
  }
  .pi-popup .mapboxgl-popup-tip { border-top-color: var(--bg) !important; border-bottom-color: var(--bg) !important; }
  .pi-popup-title { font-size: 12px; font-weight: 700; text-transform: uppercase; padding-right: 20px; line-height: 1.3; margin-bottom: 6px; }
  #pi-drawer-tab {
    position: fixed; top: 50%; right: 0; transform: translateY(-50%);
    width: 28px; height: 144px; background: var(--text); color: #FFFFFF;
    border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    z-index: 500;
  }
  #pi-drawer-tab-inner {
    display: inline-flex; align-items: center; gap: 6px;
    transform: rotate(-90deg); white-space: nowrap;
    font-size: 9px; font-weight: 700; letter-spacing: 0.16em; font-family: inherit;
  }
  #pi-drawer-dot { width: 6px; height: 6px; flex-shrink: 0; background: #00C853; transition: opacity 0.3s ease; }
  #pi-drawer-dot.hidden { opacity: 0; pointer-events: none; }
  #pi-drawer-backdrop {
    position: fixed; inset: 0; z-index: 600; opacity: 0; pointer-events: none;
    background: rgba(255,255,255,0.55); transition: opacity 0.3s ease;
  }
  #pi-drawer-backdrop.active { opacity: 1; pointer-events: auto; }
  #pi-drawer-panel {
    position: fixed; top: 0; right: 0; height: 100%; width: 340px; max-width: calc(100vw - 40px);
    background: var(--bg); border-left: 2px solid var(--text); transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.16,1,0.3,1); z-index: 700; display: flex; flex-direction: column;
  }
  #pi-drawer-panel.open { transform: translateX(0); }
  .pi-drawer-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; border-bottom: 1px solid var(--text);
    font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text); flex-shrink: 0;
  }
  .pi-drawer-close { border: none; background: transparent; cursor: pointer; width: 22px; height: 22px; font-size: 15px; color: var(--text); display: flex; align-items: center; justify-content: center; padding: 0; }
  .pi-drawer-body { flex: 1; overflow-y: auto; padding: 20px; }
  .pi-drawer-title { font-size: 20px; font-weight: 700; line-height: 1.1; text-transform: uppercase; letter-spacing: -0.02em; margin-bottom: 4px; color: var(--text); }
  .pi-drawer-sub { font-size: 11px; color: var(--subtext); margin-bottom: 20px; font-weight: 400; line-height: 1.4; }
  .pi-drawer-section-title { font-size: 9px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--subtext); margin-bottom: 8px; }
  #pi-drawer-log { display: flex; flex-direction: column; margin-bottom: 24px; }
  .pi-log-link {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; margin: 0 -12px; border-bottom: 1px solid var(--line-light);
    font-size: 11px; font-weight: 500; text-decoration: none; color: var(--text);
  }
  .pi-log-link:hover { background: var(--text); color: #FFFFFF; }
  .pi-log-link .loc { flex: 1; text-transform: uppercase; letter-spacing: 0.04em; padding-right: 12px; }
  .pi-log-link .stats { display: flex; align-items: center; gap: 10px; color: var(--subtext); font-weight: 600; flex-shrink: 0; }
  .pi-log-link:hover .stats, .pi-log-link:hover .loc { color: #FFFFFF; }
  .pi-log-link .arrow { opacity: 0; transform: translateX(-4px); font-size: 11px; }
  .pi-log-link:hover .arrow { opacity: 1; transform: translateX(0); }
  .pi-drawer-thumbs { column-count: 2; column-gap: 6px; margin-top: 6px; }
  .pi-thumb-card { break-inside: avoid; margin-bottom: 6px; background: var(--panel); border: 1px solid var(--line-light); overflow: hidden; }
  .pi-thumb-card img { width: 100%; height: auto; display: block; }
  .pi-drawer-footer { padding: 16px 20px; border-top: 1px solid var(--text); flex-shrink: 0; background: var(--bg); }
  .pi-drawer-cta { display: block; width: 100%; text-align: center; border: 1px solid var(--text); background: var(--text); color: #FFFFFF; padding: 12px; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; cursor: pointer; }
  .mobile-bar { display: none; }
  @media (max-width: 720px) {
    #context-bar { display: none; }
    #search-row { height: 48px; padding: 0 14px; }
    #search-archive-btn { font-size: 9px; }
    .mobile-only-header { display: flex; justify-content: space-between; align-items: center; }
    .mobile-grip { display: block; width: 36px; height: 3px; background: var(--line); margin: 10px auto 0; }
    #index-panel {
      position: fixed; inset: 0; width: 100% !important; height: 100% !important;
      z-index: 800; transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
      border-right: none;
    }
    #index-panel.mobile-active { transform: translateY(0); }
    .mobile-bar { display: flex; height: 52px; background: var(--text); color: #FFFFFF; border-bottom: 1px solid var(--text); }
    .mobile-bar-btn {
      flex: 1; background: transparent; border: none; color: #FFFFFF;
      font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      border-right: 1px solid #333333; text-decoration: none; position: relative;
    }
    .mobile-bar-btn:last-child { border-right: none; }
    .mobile-bar-btn .count-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 14px; height: 14px; padding: 0 3px; font-size: 8px; font-weight: 700;
      background: #FFFFFF; color: var(--text);
    }
    #map-wrap { height: calc(100dvh - 42px - 52px); }
    #pi-drawer-tab { height: 144px; width: 34px; padding-left: 6px; }
  }
</style>
</head>
<body>
<div id="topbar">
  <div id="search-row">
    <svg class="search-lead-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="square"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16" y2="16"></line></svg>
    <div id="geocoder">
      <div id="pi-search-wrap">
        <input type="text" id="pi-search-input" autocomplete="off" spellcheck="false" placeholder="SEARCH ADDRESS OR PLACE...">
        <button type="button" id="pi-search-clear" aria-label="Clear search">&times;</button>
      </div>
    </div>
    <a id="search-archive-btn" href="https://www.photoindex.au/" target="_top"><span id="search-archive-text">Search</span></a>
  </div>
  <div id="context-bar">
    <span id="context-bar-text">SELECT A PIN OR A FILTER TO OPEN A RECORD</span>
  </div>
</div>
<div class="mobile-bar">
  <button type="button" class="mobile-bar-btn" id="mobile-toggle-filters">Filters<span class="count-badge" id="mobile-filter-count" style="display:none;"></span></button>
  <button type="button" class="mobile-bar-btn" id="mobile-toggle-index">Index</button>
  <a id="mobile-search-btn" class="mobile-bar-btn" href="https://www.photoindex.au/" target="_top">Search</a>
</div>
<div id="layout">
  <aside id="index-panel">
    <div class="mobile-grip"></div>
    <div class="mobile-only-header" style="padding:14px 18px; border-bottom:1px solid var(--text); background:var(--bg); flex-shrink:0;">
      <span style="font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase;">Filters & Index</span>
      <button type="button" id="mobile-panel-close" style="border:none; background:transparent; font-size:18px; cursor:pointer; padding:4px;">&times;</button>
    </div>
    <div class="panel-section-container" id="filters-group">
      <div class="acc-head open" data-target="acc-location">
        <span class="acc-title">1. Location
