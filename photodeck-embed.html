<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PHOTOINDEX - Spatial Database</title>

<link rel="preconnect" href="https://api.mapbox.com">
<link rel="preconnect" href="https://events.mapbox.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet">
<script defer src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>

<style>
  /* --- BAZA I RESET --- */
  *, *::before, *::after {
    box-sizing: border-box; margin: 0; padding: 0;
    border-radius: 0 !important; box-shadow: none !important;
    -webkit-tap-highlight-color: transparent;
  }
  :focus-visible { outline: 1px solid #111111 !important; outline-offset: -1px; }
  
  html, body {
    width: 100%; height: 100%; height: 100dvh;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background: #FFFFFF; color: #111111; -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }
  body.pi-drawer-lock { overflow: hidden; }

  /* --- GÓRNY PASEK --- */
  #topbar { background: #FFFFFF; flex-shrink: 0; z-index: 10; }
  #search-row { display: flex; align-items: center; height: 42px; padding: 0 16px; gap: 12px; border-bottom: 1px solid #111111; background: #FFFFFF; }
  .search-lead-icon { width: 14px; height: 14px; flex-shrink: 0; stroke: #111111; }
  #geocoder { flex: 1; height: 100%; position: relative; }
  #pi-search-wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; }
  #pi-search-input { width: 100%; height: 100%; border: none; background: transparent; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #111111; outline: none; }
  #pi-search-input::placeholder { color: #888888; font-weight: 400; }
  #pi-search-clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: none; background: transparent; font-size: 20px; color: #111111; cursor: pointer; display: none; line-height: 1; padding: 4px 8px; transition: opacity 0.15s ease; }
  #pi-search-clear:hover { opacity: 0.5; }
  #search-archive-btn { height: 100%; padding: 0 4px; border: none; background: transparent; color: #111111; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; text-decoration: none; flex-shrink: 0; transition: opacity 0.15s ease; }
  #search-archive-btn:hover { opacity: 0.5; }

  /* --- GŁÓWNY UKŁAD MAPY I FILTRÓW (SZCZELNY) --- */
  #layout { width: 100%; flex: 1 1 auto; min-height: 0; background: #FFFFFF; position: relative; display: flex; overflow: hidden; margin: 0; padding: 0; }
  
  #index-panel { width: 320px; flex-shrink: 0; position: relative; height: 100%; border-right: 1px solid #111111; display: flex; flex-direction: column; background: #FFFFFF; overflow-y: auto; z-index: 3; }
  .acc-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid #EAEAEA; cursor: pointer; user-select: none; background: #FFFFFF; flex-shrink: 0; transition: background 0.15s ease; }
  .acc-head:hover { background: #FAFAFA; }
  .acc-title { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #111111; }
  .acc-icon { font-size: 14px; font-weight: 300; color: #111111; line-height: 1; transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
  .acc-head.open .acc-icon { transform: rotate(45deg); }
  .acc-body { display: none; padding: 12px 18px 18px; border-bottom: 1px solid #EAEAEA; font-size: 12px; color: #111111; background: #FFFFFF; }
  .acc-body.open { display: block; }
  .sub-category-title { font-size: 9px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #888888; margin: 14px 0 6px 0; }
  .sub-category-title:first-child { margin-top: 0; }
  .acc-body label { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 6px 0; font-size: 12px; letter-spacing: 0.02em; color: #444; transition: color 0.15s ease; }
  .acc-body label:hover { color: #000; }
  .acc-body input[type="checkbox"], .acc-body input[type="radio"] { -webkit-appearance: none; appearance: none; margin: 0; width: 12px; height: 12px; border: 1px solid #111111; background: #FFFFFF; display: grid; place-content: center; flex-shrink: 0; }
  .acc-body input[type="radio"]:checked::before { content: ""; width: 6px; height: 6px; background: #111111; }
  .acc-body input[type="checkbox"]:checked { background: #111111; }

  #list-wrap { flex: 1 1 auto; overflow-y: auto; }
  .list-row { padding: 12px 18px; border-bottom: 1px solid #EAEAEA; cursor: pointer; background: #FFFFFF; transition: background 0.15s ease; }
  .list-row:hover { background: #FAFAFA; }
  .list-street { font-size: 12px; font-weight: 500; }

  #pi-footer { padding: 16px 18px; background: #FFFFFF; border-top: 1px solid #111111; flex-shrink: 0; }
  .pi-brand { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .pi-sub { font-size: 9px; color: #888888; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
  .pi-footer-stat { font-size: 9px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #111111; margin-top: 10px; }

  /* MAPA */
  #map-wrap { flex: 1; position: relative; height: 100%; background: #F8F8F8; margin: 0; padding: 0; }
  #map { position: absolute; inset: 0; opacity: 0; transition: opacity 0.6s ease-in-out; }
  #map.loaded { opacity: 1; }
  
  .custom-marker-hitbox { width: 36px; height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; cursor: pointer; }
  .pi-pin { display: flex; flex-direction: column; align-items: center; }
  .pi-pin-body { min-width: 22px; height: 22px; padding: 0 5px; background: #111111; color: #FFFFFF; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .pi-pin-point { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 4px solid #111111; }
  .custom-marker-hitbox:hover .pi-pin-body { background: #FFFFFF; color: #111111; outline: 1px solid #111111; }
  
  /* --- POPUP (BEZ KOLIZJI Z KRZYŻYKIEM) --- */
  .pi-popup .mapboxgl-popup-content { 
    background: #FFFFFF; border: 1px solid #111111; padding: 16px; 
    font-family: 'Inter', sans-serif; position: relative;
  }
  .pi-popup .mapboxgl-popup-close-button {
    position: absolute; top: 12px; right: 12px; font-size: 16px; color: #111111;
    border: none; background: transparent; cursor: pointer; line-height: 1; padding: 4px; z-index: 10;
  }
  .pi-popup .mapboxgl-popup-close-button:hover { opacity: 0.5; }
  .pi-popup .mapboxgl-popup-tip { border-top-color: #FFFFFF !important; border-bottom-color: #FFFFFF !important; }
  
  .pi-popup-title {
    font-size: 12px; font-weight: 700; text-transform: uppercase; 
    padding-right: 20px; line-height: 1.3; margin-bottom: 6px;
  }

  /* --- WSUWANY PANEL LOGÓW (DRAWER) --- */
  #pi-drawer-tab {
    position: fixed; top: 50%; right: 0; transform: translateY(-50%);
    width: 28px; height: 116px; background: #111111; color: #FFFFFF;
    border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    z-index: 500; transition: background 0.15s ease;
  }
  #pi-drawer-tab:hover { background: #333333; }
  #pi-drawer-tab span { transform: rotate(-90deg); white-space: nowrap; font-size: 9px; font-weight: 700; letter-spacing: 0.16em; font-family: 'Inter', sans-serif; }
  
  #pi-drawer-dot {
    position: absolute; top: 9px; right: 9px; width: 6px; height: 6px;
    background: #00C853; box-shadow: 0 0 6px rgba(0, 200, 83, 0.6) !important;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  #pi-drawer-dot.hidden { opacity: 0; transform: scale(0); pointer-events: none; }

  #pi-drawer-backdrop { position: fixed; inset: 0; background: rgba(17,17,17,0.15); z-index: 600; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
  #pi-drawer-backdrop.active { opacity: 1; pointer-events: auto; }

  #pi-drawer-panel {
    position: fixed; top: 0; right: 0; height: 100%; width: 340px; max-width: calc(100vw - 40px);
    background: #FFFFFF; border-left: 2px solid #111111; transform: translateX(100%); 
    transition: transform 0.35s cubic-bezier(0.16,1,0.3,1); z-index: 700; display: flex; flex-direction: column;
    font-family: 'Inter', system-ui, sans-serif;
  }
  #pi-drawer-panel.open { transform: translateX(0); }

  .pi-drawer-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; border-bottom: 1px solid #111111;
    font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #111111; flex-shrink: 0;
  }
  .pi-drawer-close { border: none; background: transparent; cursor: pointer; width: 22px; height: 22px; font-size: 15px; color: #111111; display: flex; align-items: center; justify-content: center; padding: 0; transition: opacity 0.15s ease; }
  .pi-drawer-close:hover { opacity: 0.5; }

  .pi-drawer-body { flex: 1; overflow-y: auto; padding: 20px; }
  .pi-drawer-title { font-size: 20px; font-weight: 700; line-height: 1.1; text-transform: uppercase; letter-spacing: -0.02em; margin-bottom: 4px; color: #111111; }
  .pi-drawer-sub { font-size: 11px; color: #6B6B6B; margin-bottom: 20px; font-weight: 400; line-height: 1.4; }
  
  .pi-drawer-section-title { font-size: 9px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #888888; margin-bottom: 8px; }

  #pi-drawer-log { display: flex; flex-direction: column; margin-bottom: 24px; }
  .pi-log-link {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; margin: 0 -12px; border-bottom: 1px solid #EAEAEA;
    font-size: 11px; font-weight: 500; text-decoration: none; color: #111111;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .pi-log-link:hover { background: #111111; color: #FFFFFF; }
  .pi-log-link .loc { flex: 1; transition: color 0.15s; text-transform: uppercase; letter-spacing: 0.04em; padding-right: 12px; }
  .pi-log-link .stats { display: flex; align-items: center; gap: 10px; color: #6B6B6B; font-weight: 600; transition: color 0.15s; flex-shrink: 0; }
  .pi-log-link:hover .stats, .pi-log-link:hover .loc { color: #FFFFFF; }
  .pi-log-link .arrow { opacity: 0; transform: translateX(-4px); transition: all 0.15s ease; font-size: 11px; }
  .pi-log-link:hover .arrow { opacity: 1; transform: translateX(0); }

  /* --- MOZAIKA MINIATUR (PINTEREST STYLE) --- */
  .pi-drawer-thumbs {
    column-count: 2;
    column-gap: 6px;
    margin-top: 6px;
  }
  .pi-thumb-card {
    break-inside: avoid;
    margin-bottom: 6px;
    background: #FAFAFA;
    border: 1px solid #EAEAEA;
    overflow: hidden;
  }
  .pi-thumb-card img {
    width: 100%;
    height: auto;
    display: block;
  }

  .pi-drawer-footer { padding: 16px 20px; border-top: 1px solid #111111; flex-shrink: 0; background: #FFFFFF; }
  .pi-drawer-cta { display: block; width: 100%; text-align: center; border: 1px solid #111111; background: #111111; color: #FFFFFF; padding: 12px; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; transition: background 0.15s ease; cursor: pointer; }
  .pi-drawer-cta:hover { background: #333333; }

  /* --- WERSJA MOBILNA --- */
  .mobile-tabs { display: none; }
  #mobile-bottom-bar { display: none; }
  @media (max-width: 720px) {
    #search-row { height: 44px; padding: 0 12px; }
    #search-archive-btn { display: none; }
    .mobile-tabs { display: flex; background: #FFFFFF; border-bottom: 1px solid #111111; flex-shrink: 0; }
    .mobile-tab { flex: 1; height: 38px; border: none; border-right: 1px solid #EAEAEA; background: #FFFFFF; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; }
    .mobile-tab:last-child { border-right: none; }
    .mobile-tab.active { background: #111111; color: #FFFFFF; }
    #index-panel { width: 100%; border-right: none; display: none; }
    #index-panel.mobile-active { display: flex; }
    #map-wrap { display: none; }
    #map-wrap.mobile-active { display: block; }
    #mobile-bottom-bar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; height: calc(44px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: #111111; color: #FFFFFF; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; z-index: 9999; }
    #pi-drawer-tab { top: auto; bottom: calc(64px + env(safe-area-inset-bottom)); transform: none; height: 96px; }
  }
</style>
</head>
<body>

<div id="topbar">
  <div id="search-row">
    <svg class="search-lead-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="square"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16" y2="16"></line></svg>
    <div id="geocoder"></div>
    <a id="search-archive-btn" href="https://www.photoindex.au/" target="_top"><span id="search-archive-text">Search</span></a>
  </div>

  <div class="mobile-tabs">
    <button class="mobile-tab" id="tab-index" data-tab="index">Index</button>
    <button class="mobile-tab" id="tab-filters" data-tab="filters">Filters</button>
    <button class="mobile-tab active" id="tab-map" data-tab="map">Map</button>
  </div>
</div>

<div id="layout">
  <aside id="index-panel">
    <!-- FILTRY -->
    <div class="panel-section-container" id="filters-group">
      <div class="acc-head open" data-target="acc-location">
        <span class="acc-title">1. Location</span><span class="acc-icon">+</span>
      </div>
      <div class="acc-body open" id="acc-location">
        <label><input type="radio" name="suburb-group" class="suburb-check" value="" checked> All Locations</label>
        
        <div class="sub-category-title">Inner North & CBD</div>
        <label><input type="radio" name="suburb-group" class="suburb-check" value="Brisbane City"> Brisbane City</label>
        <label><input type="radio" name="suburb-group" class="suburb-check" value="Spring Hill"> Spring Hill</label>
        <label><input type="radio" name="suburb-group" class="suburb-check" value="Fortitude Valley"> Fortitude Valley</label>
        <label><input type="radio" name="suburb-group" class="suburb-check" value="Newstead"> Newstead</label>
        <label><input type="radio" name="suburb-group" class="suburb-check" value="Teneriffe"> Teneriffe</label>
        <label><input type="radio" name="suburb-group" class="suburb-check" value="New Farm"> New Farm</label>
        <label><input type="radio" name="suburb-group" class="suburb-check" value="Bowen Hills"> Bowen Hills</label>
        <label><input type="radio" name="suburb-group" class="suburb-check" value="Herston"> Herston</label>
        <label><input type="radio" name="suburb-group" class="suburb-check" value="Albion"> Albion</label>

        <div class="sub-category-title">Inner West</div>
        <label><input type="radio" name="suburb-group" class="suburb-check" value="Milton"> Milton</label>
        <label><input type="radio" name="suburb-group" class="suburb-check" value="Paddington"> Paddington</label>
        <label><input type="radio" name="suburb-group" class="suburb-check" value="Red Hill"> Red Hill</label>
        <label><input type="radio" name="suburb-group" class="suburb-check" value="Kelvin Grove"> Kelvin Grove</label>

        <div class="sub-category-title">Inner South</div>
        <label><input type="radio" name="suburb-group" class="suburb-check" value="South Brisbane"> South Brisbane</label>
        <label><input type="radio" name="suburb-group" class="suburb-check" value="West End"> West End</label>
        <label><input type="radio" name="suburb-group" class="suburb-check" value="Kangaroo Point"> Kangaroo Point</label>
        <label><input type="radio" name="suburb-group" class="suburb-check" value="Woolloongabba"> Woolloongabba</label>
      </div>

      <div class="acc-head" data-target="acc-condition">
        <span class="acc-title">2. Physical Condition</span><span class="acc-icon">+</span>
      </div>
      <div class="acc-body" id="acc-condition">
        <label><input type="checkbox" class="filter-check" data-cat="condition" value="Existing Condition"> Existing Condition</label>
        <label><input type="checkbox" class="filter-check" data-cat="condition" value="Fenced Development Site"> Fenced Development Site</label>
        <label><input type="checkbox" class="filter-check" data-cat="condition" value="Demolition & Site Works"> Demolition & Site Works</label>
        <label><input type="checkbox" class="filter-check" data-cat="condition" value="Active Construction Site"> Active Construction Site</label>
        <label><input type="checkbox" class="filter-check" data-cat="condition" value="Completed Development"> Completed Development</label>
      </div>

      <div class="acc-head" data-target="acc-typology">
        <span class="acc-title">3. Typology & Architecture</span><span class="acc-icon">+</span>
      </div>
      <div class="acc-body" id="acc-typology">
        <label><input type="checkbox" class="filter-check" data-cat="typology" value="Residential"> Residential</label>
        <label><input type="checkbox" class="filter-check" data-cat="typology" value="Commercial & Retail"> Commercial & Retail</label>
        <label><input type="checkbox" class="filter-check" data-cat="typology" value="Public & Civic"> Public & Civic</label>
        <label><input type="checkbox" class="filter-check" data-cat="typology" value="Heritage & Traditional"> Heritage & Traditional</label>
        <label><input type="checkbox" class="filter-check" data-cat="typology" value="Industrial"> Industrial</label>
      </div>
    </div>

    <!-- LISTA (Index) -->
    <div id="index-group" style="display:none; flex:1; flex-direction:column; min-height:0;">
      <div id="list-wrap"></div>
      <footer id="pi-footer">
        <div class="pi-brand">PHOTOINDEX</div>
        <div class="pi-sub">BRISBANE URBAN ARCHIVE</div>
        <div class="pi-footer-stat" id="archive-count">LOADING...</div>
      </footer>
    </div>
  </aside>

  <main id="map-wrap">
    <div id="map"></div>
  </main>
</div>

<a id="mobile-bottom-bar" href="https://www.photoindex.au/" target="_top">SEARCH</a>

<!-- ZAKŁADKA I SZUFLADA LOGÓW -->
<div id="pi-drawer-backdrop"></div>
<button id="pi-drawer-tab" type="button" aria-expanded="false" aria-controls="pi-drawer-panel">
  <div id="pi-drawer-dot" class="hidden"></div>
  <span>UPDATE LOG</span>
</button>

<aside id="pi-drawer-panel" role="dialog" aria-labelledby="pi-drawer-title" aria-hidden="true">
  <div class="pi-drawer-header">
    <span id="pi-drawer-index">LOADING...</span>
    <button type="button" class="pi-drawer-close" id="pi-drawer-close" aria-label="Close">&times;</button>
  </div>
  <div class="pi-drawer-body">
    <div class="pi-drawer-title" id="pi-drawer-title">New frames indexed</div>
    <div class="pi-drawer-sub" id="pi-drawer-sub">Archive total: ... records</div>
    
    <!-- 1. Lokalizacje przed miniaturami -->
    <div class="pi-drawer-section-title">By location</div>
    <div id="pi-drawer-log"></div>

    <!-- 2. Mozaika zdjęć (Pinterest style, bez linków) -->
    <div class="pi-drawer-section-title" id="pi-thumbs-title" style="display:none; margin-top:24px;">Visual preview</div>
    <div class="pi-drawer-thumbs" id="pi-drawer-thumbs"></div>
  </div>
  <div class="pi-drawer-footer">
    <button class="pi-drawer-cta" id="pi-drawer-close-btn">Close panel</button>
  </div>
</aside>

<script>
function initMapboxApp() {
  if (typeof mapboxgl === 'undefined') { setTimeout(initMapboxApp, 50); return; }

  mapboxgl.accessToken = 'pk.eyJ1IjoicGhvdG9pbmRleCIsImEiOiJjbW44aHl6NnMwYW1nMnBxMHdwc2VraTltIn0.B_Xqmf3Asxs1m_SVXIc7XQ';

  var locations = [];
  var searchState = { suburb: '' };

  var map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/light-v11',
    center: [153.0307, -27.4598],
    zoom: 13
  });
  map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'bottom-right');

  function bboxAroundPoint(center, radiusKm) {
    var latOffset = radiusKm / 111;
    var lngOffset = radiusKm / (111 * Math.cos(center[1] * Math.PI / 180));
    return [center[0] - lngOffset, center[1] - latOffset, center[0] + lngOffset, center[1] + latOffset];
  }

  function frameArea(center, bbox) {
    var bounds = bbox || bboxAroundPoint(center, 0.2);
    map.fitBounds(bounds, { padding: 60, duration: 1000, maxZoom: 14.5, essential: true });
  }

  function initCustomSearch() {
    var geocoderHost = document.getElementById('geocoder');
    if (!geocoderHost) return;
    geocoderHost.innerHTML =
      '<div id="pi-search-wrap">' +
        '<input type="text" id="pi-search-input" autocomplete="off" spellcheck="false" placeholder="SEARCH ADDRESS OR PLACE...">' +
        '<button type="button" id="pi-search-clear">\u00d7</button>' +
        '<div id="pi-search-dropdown"></div>' +
      '</div>';
      
    var searchInput = document.getElementById('pi-search-input');
    var clearBtn = document.getElementById('pi-search-clear');
    
    if (clearBtn && searchInput) {
      clearBtn.addEventListener('click', function() {
        searchInput.value = '';
        this.style.display = 'none';
        var defaultRadio = document.querySelector('.suburb-check[value=""]');
        if (defaultRadio) {
          defaultRadio.checked = true;
          searchState.suburb = '';
          applySearchState();
          map.flyTo({ center: [153.0307, -27.4598], zoom: 13, duration: 1200 });
        }
      });
      searchInput.addEventListener('input', function() {
        clearBtn.style.display = this.value ? 'block' : 'none';
      });
    }
  }
  initCustomSearch();

  // --- AUTOMATYCZNE POBIERANIE Z CSV ---
  fetch('https://raw.githubusercontent.com/sproutssorbets/bne-urban-index/main/locations.csv?t=' + Date.now())
    .then(r => r.text())
    .catch(() => '')
    .then(function (csvText) {
      if (!csvText) return;

      var lines = csvText.trim().split('\n');
      var headers = lines[0].split(',').map(h => h.trim());
      
      locations = [];
      var totalArchiveRecords = 0; 
      var batchesMap = {}; 

      for (var i = 1; i < lines.length; i++) {
        var line = lines[i];
        if(!line) continue;
        
        var cols = [];
        let cur = '', inQ = false;
        for (let c of line) {
          if (c === '"') inQ = !inQ;
          else if (c === ',' && !inQ) { cols.push(cur); cur = ''; }
          else cur += c;
        }
        cols.push(cur);
        
        var row = {};
        headers.forEach((h, idx) => row[h] = (cols[idx] || '').trim());

        var count = parseInt(row.count) || 1;
        totalArchiveRecords += count; 

        var locData = {
          ref: row.ref || 'PX.26.000',
          street: row.address || row.street || 'Unnamed location',
          suburb: row.suburb || 'Brisbane City',
          count: count,
          dates: row.shoot_dates || row.date || '',
          coords: [parseFloat(row.lng), parseFloat(row.lat)],
          archiveUrl: row.archiveUrl || '#'
        };
        
        if (!isNaN(locData.coords[0]) && !isNaN(locData.coords[1])) {
          locations.push(locData);
        }

        var batchId = row.update_batch || 'UNKNOWN';
        if (!batchesMap[batchId]) batchesMap[batchId] = [];
        batchesMap[batchId].push(locData);
      }

      // --- GENEROWANIE SZUFLADY DLA NAJNOWSZEJ PACZKI ---
      var sortedBatches = Object.keys(batchesMap).filter(b => b !== 'UNKNOWN').sort(function(a, b) {
        var dateA = new Date(a);
        var dateB = new Date(b);
        if (!isNaN(dateA) && !isNaN(dateB)) return dateB - dateA;
        return b.localeCompare(a); 
      });

      var latestBatchId = sortedBatches[0]; 
      
      if (latestBatchId) {
        var latestRecords = batchesMap[latestBatchId];
        var latestTotalCount = 0;

        latestRecords.forEach(rec => {
          latestTotalCount += rec.count;
        });

        document.getElementById('pi-drawer-index').innerHTML = 'UPDATE &middot; ' + latestBatchId.toUpperCase();
        document.getElementById('pi-drawer-title').textContent = latestTotalCount + ' new frames indexed';
        document.getElementById('pi-drawer-sub').textContent = 'Archive total: ' + totalArchiveRecords + ' records';

        // Rejestr po pełnym adresie
        var logContainer = document.getElementById('pi-drawer-log');
        if (logContainer) {
          logContainer.innerHTML = latestRecords.map(function(rec) {
            var padCount = rec.count.toString().padStart(2, '0');
            var linkUrl = rec.archiveUrl || 'https://www.photoindex.au/';
            return '<a href="' + linkUrl + '" target="_top" class="pi-log-link" data-query="' + rec.street + '">' +
                     '<span class="loc">' + rec.street + '</span>' +
                     '<span class="stats">' +
                       '<span class="count">' + padCount + '</span>' +
                       '<span class="arrow">→</span>' +
                     '</span>' +
                   '</a>';
          }).join('');
          
          logContainer.querySelectorAll('.pi-log-link').forEach(function(link) {
            link.addEventListener('mouseenter', function() {
              var q = this.getAttribute('data-query');
              if (window.piFlyToQuery) window.piFlyToQuery(q);
            });
          });
        }
        
        // Dynamiczne pobranie WSZYSTKICH miniatur w mozaice (bez linkowania)
        fetch('https://api.github.com/repos/sproutssorbets/bne-urban-index/contents/photos')
          .then(res => res.json())
          .then(files => {
            if (Array.isArray(files)) {
              var photoUrls = files
                .filter(f => f.type === 'file' && f.name.match(/\.(jpg|jpeg|png)$/i))
                .map(f => f.download_url);
              
              var thumbsContainer = document.getElementById('pi-drawer-thumbs');
              var thumbsTitle = document.getElementById('pi-thumbs-title');

              if (thumbsContainer && photoUrls.length > 0) {
                if (thumbsTitle) thumbsTitle.style.display = 'block';
                thumbsContainer.innerHTML = photoUrls.map(function(url) {
                  return '<div class="pi-thumb-card">' +
                           '<img src="' + url + '" alt="Archive Record" loading="lazy">' +
                         '</div>';
                }).join('');
              }
            }
          })
          .catch(() => {});

        // Obsługa 24-godzinnej zielonej kropki
        var dot = document.getElementById('pi-drawer-dot');
        if (dot) {
          var storageKey = 'pi_archive_seen_time_' + latestBatchId;
          var firstSeenTime = localStorage.getItem(storageKey);
          var now = new Date().getTime();
          var twentyFourHours = 24 * 60 * 60 * 1000;

          if (!firstSeenTime) {
            localStorage.setItem(storageKey, now);
            dot.classList.remove('hidden');
            if (window.piOpenDrawer) {
              setTimeout(window.piOpenDrawer, 600);
            }
          } else {
            var elapsed = now - parseInt(firstSeenTime, 10);
            if (elapsed < twentyFourHours) {
              dot.classList.remove('hidden');
            } else {
              dot.classList.add('hidden');
            }
          }
        }
        window.CURRENT_BATCH_ID = latestBatchId;
      }

      if (map.loaded()) setupMap(); else map.on('load', setupMap);
    });

  function setupMap() {
    var activePopup = null;
    window.piCloseAllPopups = function() {
      if (activePopup) { activePopup.remove(); activePopup = null; }
    };
    window.piOpenPopup = function(popup, coords) {
      window.piCloseAllPopups();
      popup.setLngLat(coords).addTo(map);
      activePopup = popup;
    };

    locations.forEach((loc) => {
      var el = document.createElement('div');
      el.className = 'custom-marker-hitbox';
      el.innerHTML = '<div class="pi-pin"><div class="pi-pin-body">' + loc.count + '</div><div class="pi-pin-point"></div></div>';

      var datesList = loc.dates ? loc.dates.split(';').map(d => d.trim()).filter(Boolean) : [];
      var datesDesc = datesList.slice().reverse();

      var rows = [ ['Suburb', loc.suburb], ['Photos', String(loc.count)] ];
      datesDesc.forEach(function (d, i) { rows.push([i === 0 ? 'Photographed' : '', d]); });

      var rowsHtml = rows.map(function (r) {
        return '<div style="display:flex;justify-content:space-between;gap:12px;font-size:10px;padding:3px 0;">' +
          '<span style="color:#888;text-transform:uppercase;">' + r[0] + '</span>' +
          '<span style="color:#111;font-weight:500;">' + r[1] + '</span>' +
        '</div>';
      }).join('');

      var popupHtml =
        '<div style="min-width:180px; position:relative;">' +
          '<div class="pi-popup-title">' + loc.street + '</div>' +
          '<div style="border-top:1px solid #111;border-bottom:1px solid #111;padding:6px 0;margin-bottom:8px;">' + rowsHtml + '</div>' +
          '<a href="' + loc.archiveUrl + '" target="_top" style="display:block;text-align:center;background:#111;color:#FFF;padding:8px;font-size:9px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;text-decoration:none;">OPEN RECORD →</a>' +
        '</div>';

      loc.popup = new mapboxgl.Popup({ offset: [0, -42], closeButton: true, className: 'pi-popup' }).setHTML(popupHtml);
      loc.marker = new mapboxgl.Marker({ element: el, anchor: 'bottom' }).setLngLat(loc.coords).addTo(map);

      el.addEventListener('click', (ev) => { ev.stopPropagation(); window.piOpenPopup(loc.popup, loc.coords); });
    });

    renderList();
    applySearchState();
    map.once('idle', () => { document.getElementById('map').classList.add('loaded'); });
  }

  function updatePhotoDeckLink() {
    var queryStr = searchState.suburb ? '"' + searchState.suburb + '"' : '';
    var btnDesktop = document.getElementById('search-archive-btn');
    var txtDesktop = document.getElementById('search-archive-text');
    var btnMobile = document.getElementById('mobile-bottom-bar');
    var targetUrl = queryStr ? 'https://www.photoindex.au/?search=' + encodeURIComponent(queryStr) : 'https://www.photoindex.au/';
    var textValue = queryStr ? 'VIEW SELECTION' : 'SEARCH';

    if (btnDesktop) { btnDesktop.href = targetUrl; if (txtDesktop) txtDesktop.textContent = textValue; }
    if (btnMobile) { btnMobile.href = targetUrl; btnMobile.textContent = textValue; }
  }

  function applySearchState() {
    locations.forEach(loc => { if (loc.marker) loc.marker.getElement().style.display = ''; });
    var visibleLocs = locations.filter(loc => !searchState.suburb || loc.suburb.toLowerCase() === searchState.suburb.toLowerCase());
    renderList(visibleLocs);
    updatePhotoDeckLink();
    var archiveCountEl = document.getElementById('archive-count');
    if (archiveCountEl) archiveCountEl.textContent = visibleLocs.length + ' LOCATIONS LINKED';
  }

  function renderList(items) {
    var wrap = document.getElementById('list-wrap');
    if (!wrap) return;
    wrap.innerHTML = '';
    (items || locations).slice(0, 100).forEach(loc => {
      var row = document.createElement('div');
      row.className = 'list-row';
      row.innerHTML = '<div class="list-street">' + loc.street + '</div>';
      row.addEventListener('click', () => {
        if (window.innerWidth <= 720) document.getElementById('tab-map').click();
        map.flyTo({ center: loc.coords, zoom: 15 });
        if (window.piOpenPopup && loc.popup) window.piOpenPopup(loc.popup, loc.coords);
      });
      wrap.appendChild(row);
    });
  }

  document.querySelectorAll('.acc-head').forEach(h => {
    h.addEventListener('click', function () {
      this.classList.toggle('open');
      var body = document.getElementById(this.getAttribute('data-target'));
      if (body) body.classList.toggle('open');
    });
  });

  document.querySelectorAll('.suburb-check').forEach(cb => {
    cb.addEventListener('change', function () {
      if (window.piCloseAllPopups) window.piCloseAllPopups();
      searchState.suburb = this.value;
      var searchInput = document.getElementById('pi-search-input');
      var clearBtn = document.getElementById('pi-search-clear');
      if (searchInput) {
        searchInput.value = this.value;
        if (clearBtn) clearBtn.style.display = this.value ? 'block' : 'none';
      }
      applySearchState();

      if (this.value) {
        fetch('https://api.mapbox.com/geocoding/v5/mapbox.places/' + encodeURIComponent(this.value + ', Brisbane, Australia') + '.json?access_token=' + mapboxgl.accessToken + '&country=au&types=place,locality,neighborhood&limit=1')
          .then(r => r.json())
          .then(data => { if (data.features && data.features[0]) frameArea(data.features[0].center, data.features[0].bbox); });
        if (window.innerWidth <= 720) document.getElementById('tab-map').click();
      } else {
        map.flyTo({ center: [153.0307, -27.4598], zoom: 13, duration: 1200 });
      }
    });
  });

  var tabs = { 'tab-index': 'index-group', 'tab-filters': 'filters-group', 'tab-map': 'map-wrap' };
  Object.keys(tabs).forEach(tabId => {
    var btn = document.getElementById(tabId);
    if (!btn) return;
    btn.addEventListener('click', function() {
      document.querySelectorAll('.mobile-tabs .mobile-tab').forEach(t => t.classList.remove('active'));
      this.classList.add('active');

      var isMap = tabId === 'tab-map';
      var indexPanel = document.getElementById('index-panel');

      indexPanel.classList.toggle('mobile-active', !isMap);
      indexPanel.style.display = isMap ? 'none' : 'flex';
      document.getElementById('map-wrap').classList.toggle('mobile-active', isMap);

      if (!isMap) {
        document.getElementById('index-group').style.display = tabId === 'tab-index' ? 'flex' : 'none';
        document.getElementById('filters-group').style.display = tabId === 'tab-filters' ? 'flex' : 'none';
      } else {
        setTimeout(() => map.resize(), 50);
      }
    });
  });

  if (window.innerWidth <= 720) {
    var tm = document.getElementById('tab-map');
    if (tm) tm.click();
  }

  window.piFlyToQuery = function(query) {
    if (!query || !locations || !locations.length) return;
    var match = locations.find(l => l.street.toLowerCase().includes(query.toLowerCase()) || l.suburb.toLowerCase() === query.toLowerCase());
    if (match) {
      if (window.innerWidth <= 720) {
        var tm = document.getElementById('tab-map');
        if (tm) tm.click();
      }
      map.flyTo({ center: match.coords, zoom: 15, speed: 1.2 });
      if (window.piOpenPopup && match.popup) window.piOpenPopup(match.popup, match.coords);
    }
  };
}

initMapboxApp();

// --- OBSŁUGA INTERFEJSU DRAWERA ---
document.addEventListener('DOMContentLoaded', function () {
  var tab = document.getElementById('pi-drawer-tab');
  var panel = document.getElementById('pi-drawer-panel');
  var closeBtn = document.getElementById('pi-drawer-close');
  var closeBtnAlt = document.getElementById('pi-drawer-close-btn');
  var backdrop = document.getElementById('pi-drawer-backdrop');

  function openDrawer() {
    panel.classList.add('open');
    backdrop.classList.add('active');
    panel.setAttribute('aria-hidden', 'false');
    tab.setAttribute('aria-expanded', 'true');
    document.addEventListener('keydown', onKeydown);
  }

  function closeDrawer() {
    panel.classList.remove('open');
    backdrop.classList.remove('active');
    panel.setAttribute('aria-hidden', 'true');
    tab.setAttribute('aria-expanded', 'false');
    document.removeEventListener('keydown', onKeydown);
  }

  function onKeydown(ev) {
    if (ev.key === 'Escape') closeDrawer();
  }

  tab.addEventListener('click', function () {
    if (panel.classList.contains('open')) closeDrawer(); 
    else openDrawer();
  });
  
  closeBtn.addEventListener('click', closeDrawer);
  if (closeBtnAlt) closeBtnAlt.addEventListener('click', closeDrawer);
  backdrop.addEventListener('click', closeDrawer);

  window.piOpenDrawer = openDrawer;
  window.piCloseDrawer = closeDrawer;
});
</script>
