<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:#000;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.bar{height:52px;display:flex;align-items:center;gap:8px;padding:0 14px 0 20px;border-bottom:1px solid #000}
.bar a{display:flex;align-items:center;gap:8px;color:#111;text-decoration:none;font-size:14px;font-weight:500}

.primary{display:flex;align-items:center;justify-content:center;height:48px;background:#111;color:#fff;border-radius:999px;font-size:12px;font-weight:500;letter-spacing:.96px;text-transform:uppercase;margin-bottom:20px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-top:1px solid #DADADA}
.row:last-child{border-bottom:1px solid #DADADA}
.t{display:block;font-size:13px;line-height:1.3}
.s{display:block;font-size:11px;line-height:1.45;color:#666;margin-top:3px}
.arr{font-size:13px;flex:none;transition:transform .15s}
.row:hover .arr{transform:translateX(2px)}
.primary:active,.row:active{opacity:.7}
@media (min-width:700px){main{padding-top:56px}h1{font-size:40px;line-height:1.1;letter-spacing:-.4px}}
