<style>
:root{--ink:#111;--mute:#6b6b6b;--line:#dadada;--bg:#fff;--chip:#f1f1ef;--red:#C62F28;--r-sm:10px;--r-md:16px;--r-pill:999px;--bar:72px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%;min-height:0}
/* top bar */
#bar{display:flex;align-items:center;gap:8px 24px;min-height:var(--bar);padding:12px 24px;flex:none}
.tbtn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0;border:none;border-bottom:1px solid transparent;background:transparent;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;flex:none}
.tbtn:hover,.tbtn[aria-expanded=true],.tbtn[aria-pressed=true]{border-bottom-color:var(--ink)}
.tbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:square}
.badge::before{content:"("}.badge::after{content:")"}
.badge{font-weight:400}
#chips{display:flex;align-items:center;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none;flex:0 1 auto}
#chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;background:var(--chip);border-radius:var(--r-pill);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;flex:none}
.chip button{border:none;background:transparent;font-size:14px;line-height:1;padding:0 2px}
.chip button:hover{opacity:.4}
#clear{border:none;background:transparent;font-size:11px;color:var(--mute);text-decoration:underline;text-underline-offset:3px;display:none;flex:none}
#clear:hover{color:var(--ink)}
.qwrap{position:relative;flex:1 1 240px;min-width:140px;display:flex;align-items:center;background:var(--chip);border:1px solid transparent;border-radius:var(--r-pill);transition:background .15s,border-color .15s}
.qwrap:focus-within{background:#fff;border-color:var(--ink)}
.qicon{position:absolute;left:16px;width:16px;height:16px;fill:none;stroke:var(--mute);stroke-width:1.5;pointer-events:none}
#q{width:100%;height:44px;border:none;background:transparent;padding:0 16px 0 42px;font-size:14px;outline:none}
#q::placeholder{color:#666}
#sug{display:none;position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:700;background:#fff;border:1px solid var(--ink);border-radius:var(--r-md);padding:6px;max-height:60vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,0.1)}
#sug.open{display:block}
.sg{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;font-size:12px;cursor:pointer;border-radius:var(--r-sm)}
.sg:hover,.sg.on{background:var(--ink);color:#fff}
.sg span:last-child{font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
/* sub bar */
#sub{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:0 24px;flex:none}
#tabs{display:flex;gap:28px;overflow-x:auto;scrollbar-width:none}
.tab{height:44px;border:none;border-bottom:1px solid transparent;background:transparent;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#9a9a96;white-space:nowrap;padding:0}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab .n{font-weight:400;margin-left:6px}
#dens{display:flex;align-items:center;gap:6px;height:44px;font-size:11px;letter-spacing:.06em;color:var(--mute)}
#dens .l{margin-right:6px;text-transform:uppercase;letter-spacing:.12em}
#dens button{width:28px;height:28px;border:none;background:transparent;font-size:16px;line-height:1;border-radius:50%}
#dens button:hover:not(:disabled){background:var(--chip)}
#dens button:disabled{color:#c8c8c4;cursor:default}
#dens b{min-width:14px;text-align:center;color:var(--ink);font-weight:400}
/* split */
#split{display:flex;flex:1;min-height:0;position:relative}
#panel{display:none;flex:0 0 320px;width:320px;flex-direction:column;background:#fff;border-right:1px solid var(--line);min-height:0}
#panel.open{display:flex}
.ph{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;flex:none;border-bottom:1px solid var(--line)}
.pt{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.px{width:32px;height:32px;border:none;background:transparent;font-size:20px;font-weight:300;border-radius:50%}
.px:hover{background:var(--chip)}
/* Filter Search */
.pf-search{padding:12px 16px 0;flex:none}
.pf-search input{width:100%;height:36px;border:1px solid var(--line);border-radius:var(--r-sm);padding:0 12px;font-size:12px;background:#fafafa}
.pf-search input:focus, .pf-search input:focus-visible{background:#fff;border-color:var(--ink);outline:none}
#fgrid{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;padding-bottom:16px}
.sec{border-bottom:1px solid #ececea}
.sh{display:flex;align-items:center;gap:8px;width:100%;padding:16px 24px;border:none;background:transparent;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;text-align:left}
.sh:hover{color:var(--mute)}
.sh span:first-child{flex:1}
.sh .ic{width:12px;font-size:14px;font-weight:400;text-align:center}
.sb{padding:0 16px 12px}
.grp{margin:16px 0 4px;font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.sb>.grp:first-child{margin-top:2px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:6px 10px;margin:0 -10px;font-size:12px;border-radius:var(--r-sm);cursor:pointer}
.opt:hover{background:#f0f0f0}
.opt input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.opt .t{flex:1;line-height:1.5}
.opt .t::before{content:"";display:inline-block;width:6px;height:6px;margin-right:10px;vertical-align:1px;border-radius:50%;background:transparent}
.opt input:checked+.t::before{background:var(--ink)}
.opt input:checked+.t{font-weight:500}
.opt input:focus-visible+.t{text-decoration:underline;text-underline-offset:3px}
.opt .c{margin-left:auto;font-size:11px;color:var(--mute);padding-top:1px}
#done{flex:none;margin:12px 16px 16px;height:48px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:var(--r-pill);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
#done:hover{background:#fff;color:var(--ink)}
#main{flex:1 1 0;min-width:0;overflow-y:auto;padding:8px 24px 72px;scroll-behavior:smooth}
#info{display:flex;justify-content:space-between;gap:12px;font-size:11px;letter-spacing:.02em;color:var(--mute);padding:14px 0 12px;min-height:32px}
#wall{position:relative;width:100%}
.card{position:absolute;left:0;top:0;display:block;overflow:hidden;background:#ececea;border-radius:var(--r-md);isolation:isolate;color:#fff;text-decoration:none}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;animation:fade .5s both;transition:transform .8s cubic-bezier(.4,0,.2,1)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card:hover img{transform:scale(1.025)}
.card::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,.18) 55%,rgba(0,0,0,.18));transition:opacity .15s}
.card:hover::after,.card:focus-visible::after{opacity:1}
.ovt{position:absolute;z-index:2;left:14px;right:84px;bottom:14px;font-size:11px;font-weight:500;line-height:1.3;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .15s}
.eye{position:absolute;z-index:2;right:12px;bottom:10px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.eye svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.card:hover .ovt,.card:hover .eye,.card:focus-visible .ovt,.card:focus-visible .eye{opacity:1}
@media (hover:none){.card::after,.ovt,.eye,.acts{opacity:1}}
.acts{position:absolute;z-index:3;right:10px;bottom:10px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
.card:hover .acts,.card:focus-visible .acts{opacity:1}
.ib{width:30px;height:30px;border-radius:50%;border:1px solid #111;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,color .15s}
.ib:hover,.ib.on{background:#111;color:#fff}
.ib svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib.busy{opacity:.45;pointer-events:none}
#locgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;padding:8px 0 40px}
.lc{position:relative;display:block;aspect-ratio:4/3;overflow:hidden;background:#ececea;border-radius:var(--r-md);border:none;padding:0;text-align:left;color:#fff;isolation:isolate}
.lc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lc::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),rgba(0,0,0,0) 60%)}
.lc .lt{position:absolute;z-index:2;left:14px;right:14px;bottom:12px;font-size:12px;font-weight:500;line-height:1.3}
.lc .ln{display:block;font-size:11px;font-weight:400;opacity:.8;margin-top:2px}
.lc.on{outline:2px solid var(--ink);outline-offset:-2px}
.empty{padding:32px 0;color:#666;font-size:13px;max-width:520px}
.empty b{display:block;color:#000;font-weight:500;margin-bottom:4px}
#mapcol{display:none;flex:0 0 42%;position:relative;border-left:1px solid var(--line);background:#fff}
body.map #mapcol{display:block}
body.panel #mapcol{display:none}
#mapbox{position:absolute;inset:0}
#note{display:none;align-items:center;justify-content:space-between;gap:16px;min-height:32px;padding:6px 16px 6px 24px;background:#fff;border-top:1px solid var(--line);font-size:11px;color:var(--mute);flex:none}
#note button{border:none;background:transparent;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;text-decoration:underline}
#note.show{display:flex}

/* Mobile Bottom Sheet & UI overrides */
@media (max-width:900px){
 #bar{padding:8px 16px;gap:4px 20px;min-height:0;flex-wrap:wrap}
 #sub{padding:0 16px;flex-wrap:wrap}
 #dens{display:none}
 #main{padding:8px 16px 56px}
 #split{flex-direction:column}
 #mapcol{flex:none;width:100%;height:45vh;order:-1;border-left:none;border-bottom:1px solid var(--line)}

 /* Animowany panel Bottom Sheet */
 #panel{
    display:flex !important;
    position:fixed; bottom:0; top:auto; left:0; right:0;
    width:100%; height:85vh;
    background:#fff; z-index:9999;
    border-radius:24px 24px 0 0; border-right:none;
    box-shadow:0 -10px 40px rgba(0,0,0,0.15);
    transform:translateY(100%); visibility:hidden;
    transition:transform 0.4s cubic-bezier(0.32, 0.72, 0, 1), visibility 0.4s;
 }
 #panel.open{
    transform:translateY(0); visibility:visible;
 }

 .qwrap{order:5;flex-basis:100%}
 #chips{order:4;flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){.card img,.card::after,.ovt,.eye,#panel{transition:none;animation:none}}
.mm{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.mm .seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-pill);overflow:hidden}
.mm button{border:none;background:transparent;padding:5px 12px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--mute);cursor:pointer}
.mm button[aria-pressed=true]{background:var(--ink);color:#fff}
#subr{display:flex;align-items:center;gap:24px}
#sortw{position:relative;display:flex;align-items:center;gap:8px;height:44px;font-size:11px;letter-spacing:.06em;color:var(--mute)}
#sortw .l{text-transform:uppercase;letter-spacing:.12em}
#sortbtn{display:inline-flex;align-items:center;gap:8px;padding:6px 0;border:none;border-bottom:1px solid transparent;background:transparent;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
#sortbtn:hover,#sortbtn[aria-expanded=true]{border-bottom-color:var(--ink)}
#sortbtn svg,#sortlist svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#sortbtn .cv svg{width:12px;height:12px}
#sortbtn .cv{display:inline-flex;margin-left:-2px}
#sortlist{display:none;position:absolute;top:calc(100% + 4px);right:0;z-index:700;min-width:200px;background:#fff;border:1px solid var(--ink);border-radius:18px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,0.1);flex-direction:column;gap:2px}
#sortlist.open{display:flex}
.so{display:flex;align-items:center;gap:12px;padding:12px 16px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);border-radius:14px;cursor:pointer;transition:background .15s, color .15s}
.so .sl{flex:1}
.so .ck{display:inline-flex;visibility:hidden}
.so[aria-selected=true] .ck{visibility:visible}
.so:hover,.so.act{background:var(--ink);color:#fff}
@media (max-width:900px){#sortlist{right:auto;left:0}}
.cj{flex:none;font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}

/* Mapbox Clustering Override styles */
.mapboxgl-popup { padding-bottom: 50px; }
.mapboxgl-popup-content { font-family: Inter, sans-serif; border-radius: 12px; padding: 12px 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
</style>

function parseCSV(text){

  for(i=0;i<text.length;i++){c=text.charAt(i);
    if(q){if(c==='"'){if(text.charAt(i+1)==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===","){row.push(cur);cur=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text.charAt(i+1)==="\n")i++;row.push(cur);cur="";if(row.length>1||row[0]!=="")rows.push(row);row=[]}
    else cur+=c}
  if(cur!==""||row.length){row.push(cur);rows.push(row)}
  return rows}

function loadPlaces(text){
  var t=parseCSV(text),idx={},out=[];
  if(t.length<2)return out;
  t[0].forEach(function(h,i){idx[h.trim()]=i});
  function g(r,k){return idx[k]==null?"":String(r[idx[k]]||"").trim()}
  var seen={};
  for(var i=1;i<t.length;i++){var r=t[i],name=g(r,"address")||g(r,"street");
    if(!name||lc(name)==="title")continue;
    var lat=parseFloat(g(r,"lat")),lng=parseFloat(g(r,"lng"));
    var ok=isFinite(lat)&&isFinite(lng)&&lng>152.5&&lng<153.6&&lat>-28.1&&lat<-26.6;
    var id=lc(name);
    if(seen[id]){if(ok&&seen[id].lat==null){seen[id].lat=lat;seen[id].lng=lng}continue}
    var pl={id:id,name:name,street:g(r,"street"),suburb:g(r,"suburb"),lat:ok?lat:null,lng:ok?lng:null,titles:g(r,"titles").split(";")};
    seen[id]=pl;out.push(pl)}
  return out}

function prep(){
  var byKey={};
  PLACES.forEach(function(pl){PLACEBYNAME[pl.name]=pl;[pl.name,pl.street].concat(pl.titles).forEach(function(k){k=lc(k);if(k&&!byKey[k])byKey[k]=pl})});
  DATA.forEach(function(p){
    p._ratio=p.width>0&&p.height>0?p.height/p.width:.667;
    var title=String(p.title||""),name=title;
    if(p.suburb){var suf=(", "+p.suburb).toLowerCase();if(name.toLowerCase().slice(-suf.length)===suf)name=name.slice(0,-suf.length).trim()}
    p._name=name;
    var pl=byKey[lc(title)]||byKey[lc(name)]||null;
    p._place=pl&&pl.lat!=null?pl:null;
    p._loc=pl?pl.name:name;
    p._v={};
    
    FACETS.forEach(function(F){
      var v=p[F.key];
      
      /* Automatyczne rozdzielanie starych faset z zachowaniem kompatybilności wstecznej */
      if(F.key==="material" && !v && p.architecture){
        var mats=VOC.material.map(lc);
        var archList=(Array.isArray(p.architecture)?p.architecture:[p.architecture]).map(lc);
        v=archList.filter(function(x){return mats.indexOf(x)>-1});
      }
      if(F.key==="flora" && !v && p.urban){
        var floras=VOC.flora.map(lc);
        var urbanList=(Array.isArray(p.urban)?p.urban:[p.urban]).map(lc);
        v=urbanList.filter(function(x){return floras.indexOf(x)>-1});
      }
      if(F.key==="topography" && !v && p.urban){
        var topos=VOC.topography.map(lc);
        var urbanList=(Array.isArray(p.urban)?p.urban:[p.urban]).map(lc);
        v=urbanList.filter(function(x){return topos.indexOf(x)>-1});
      }
      if(F.key==="condition" && !v && p.site){
        v=p.site;
      }
      
      p._v[F.key]=(Array.isArray(v)?v:v?[v]:[]).map(lc);
    });

    /* Skrypt czyszczący: permanentne usuwanie duplikatów z rozdzielonych faset we frontendzie */
    var materialTerms = VOC.material.map(lc);
    p._v.architecture = p._v.architecture.filter(function(tag) { return materialTerms.indexOf(tag) === -1; });

    var floraTerms = VOC.flora.map(lc);
    var topoTerms = VOC.topography.map(lc);
    if(p._v.urban) {
        p._v.urban = p._v.urban.filter(function(tag) { 
            return floraTerms.indexOf(tag) === -1 && topoTerms.indexOf(tag) === -1; 
        });
    }

    p._hay=[p.title,p._loc,p.description,p.suburb,p.photoId,p.date,p.tokens].concat(FACETS.map(function(F){return p._v[F.key].join(" ")})).join(" ").toLowerCase()});
  
  FACETS.forEach(function(F){MULTI[F.key]=!F.radio&&DATA.some(function(p){return p._v[F.key].length>1})});
  var f=[],o=[];DATA.forEach(function(p){(p.isFeatured?f:o).push(p)});
  if(f.length&&o.length)DATA=f.concat(o);
  DATA.forEach(function(p,i){p._i=i})}

/* ---------- map w/ clustering ---------- */
function ensureMap(){
  if(MAP||MAPLOAD||!S.map)return;
  MAPLOAD=true;
  var note=$("note");try{if(!window.localStorage.getItem("pi_map_note"))note.classList.add("show")}catch(e){note.classList.add("show")}
  if(window.mapboxgl){initMap();return}
  var l=document.createElement("link");l.rel="stylesheet";l.href="https://api.mapbox.com/mapbox-gl-js/"+CFG.mbVersion+"/mapbox-gl.css";document.head.appendChild(l);
  var s=document.createElement("script");s.src="https://api.mapbox.com/mapbox-gl-js/"+CFG.mbVersion+"/mapbox-gl.js";s.async=true;s.onload=initMap;s.onerror=function(){MAPLOAD=false};document.head.appendChild(s)}

function initMap(){
  var box=$("mapbox");if(!box||!window.mapboxgl||MAP)return;
  window.mapboxgl.accessToken=CFG.token;
  MAP=new window.mapboxgl.Map({container:box,style:"mapbox://styles/mapbox/light-v11",center:[153.0307,-27.4598],zoom:12});
  MAP.addControl(new window.mapboxgl.NavigationControl({showCompass:false}),"top-right");
  
  MAP.on("load",function(){
    MAPREADY=true;
    MAP.addSource("places",{
        type:"geojson",
        data:{type:"FeatureCollection",features:[]},
        cluster: true,
        clusterMaxZoom: 14,
        clusterRadius: 50
    });
    
    /* Cluster Layers */
    MAP.addLayer({
        id: "clusters",
        type: "circle",
        source: "places",
        filter: ["has", "point_count"],
        paint: {
            "circle-color": ["step", ["get", "point_count"], "#111", 10, "#333", 50, "#555"],
            "circle-radius": ["step", ["get", "point_count"], 15, 10, 20, 50, 25],
            "circle-stroke-width": 1,
            "circle-stroke-color": "#ffffff"
        }
    });

    MAP.addLayer({
        id: "cluster-count",
        type: "symbol",
        source: "places",
        filter: ["has", "point_count"],
        layout: {
            "text-field": "{point_count_abbreviated}",
            "text-font": ["DIN Offc Pro Medium", "Arial Unicode MS Bold"],
            "text-size": 12
        },
        paint: { "text-color": "#ffffff" }
    });

    /* Unclustered Point Layers */
    MAP.addLayer({
        id: "unclustered-point",
        type: "circle",
        source: "places",
        filter: ["!", ["has", "point_count"]],
        paint: {
            "circle-radius": ["interpolate",["linear"],["get","n"],1,4.5,10,6.5,30,9],
            "circle-color": "#111111",
            "circle-opacity": 0.5,
            "circle-stroke-width": 1,
            "circle-stroke-color": "#ffffff",
            "circle-stroke-opacity": 0.9
        }
    });
    
    MAP.addLayer({id:"hot",type:"circle",source:"places",filter:["==",["get","id"],""],paint:{"circle-radius":6.5,"circle-color":CFG.red,"circle-opacity":1,"circle-stroke-width":1,"circle-stroke-color":"#ffffff"}});
    MAP.addLayer({id:"sel",type:"circle",source:"places",filter:["==",["get","id"],selId()],paint:{"circle-radius":6.5,"circle-color":CFG.red,"circle-opacity":1,"circle-stroke-width":1,"circle-stroke-color":"#ffffff"}});
    
    /* Click Events */
    MAP.on("click","unclustered-point",function(e){var f=e.features&&e.features[0];if(!f)return;var pl=PLACEBYNAME[f.properties.name];if(!pl)return;S.loc=S.loc===pl.name?"":pl.name;S.tab="photo";render();$("main").scrollTop=0});
    MAP.on('click', 'clusters', function (e) {
        var features = MAP.queryRenderedFeatures(e.point, { layers: ['clusters'] });
        var clusterId = features[0].properties.cluster_id;
        MAP.getSource('places').getClusterExpansionZoom(clusterId, function (err, zoom) {
            if (err) return;
            MAP.easeTo({ center: features[0].geometry.coordinates, zoom: zoom });
        });
    });

    /* Cursor Management */
    MAP.on("mouseenter","unclustered-point",function(){MAP.getCanvas().style.cursor="pointer"});
    MAP.on("mouseleave","unclustered-point",function(){MAP.getCanvas().style.cursor=""});
    MAP.on('mouseenter', 'clusters', function () { MAP.getCanvas().style.cursor = 'pointer'; });
    MAP.on('mouseleave', 'clusters', function () { MAP.getCanvas().style.cursor = ''; });

    mapUpdate(true)})}

function selId(){var pl=S.loc&&PLACEBYNAME[S.loc];return pl?pl.id:""}
function mapUpdate(fit){
  if(!MAP||!MAPREADY)return;
  var counts={};DATA.forEach(function(p){if(p._place&&pass(p,"loc")){counts[p._place.id]=(counts[p._place.id]||0)+1}});
  var feats=[],minLng=1e9,maxLng=-1e9,minLat=1e9,maxLat=-1e9;
  PLACES.forEach(function(pl){if(pl.lat==null||!counts[pl.id])return;feats.push({type:"Feature",properties:{id:pl.id,name:pl.name,n:counts[pl.id]},geometry:{type:"Point",coordinates:[pl.lng,pl.lat]}});
    minLng=Math.min(minLng,pl.lng);maxLng=Math.max(maxLng,pl.lng);minLat=Math.min(minLat,pl.lat);maxLat=Math.max(maxLat,pl.lat)});
  var src=MAP.getSource("places");if(src)src.setData({type:"FeatureCollection",features:feats});
  MAP.setFilter("sel",["==",["get","id"],selId()]);
  if(fit&&!FITTED&&feats.length){FITTED=true;MAP.fitBounds([[minLng,minLat],[maxLng,maxLat]],{padding:60,duration:0,maxZoom:15})}}
function mapHot(id){if(MAP&&MAPREADY)MAP.setFilter("hot",["==",["get","id"],id||""])}

/* ---------- render ---------- */
function render(){
  LIST=sortList(DATA.filter(function(p){return pass(p,null)}));
  var locs=groupBy(LIST,function(p){return p._loc}),subs=groupBy(LIST,function(p){return p.suburb});
  renderTabs({photo:LIST.length,location:locs.length,suburb:subs.length});
  renderChips();
  if(S.panel)renderPanel();
  var wall=$("wall"),lg=$("locgrid"),em=$("empty");
  wall.innerHTML="";lg.innerHTML="";em.innerHTML="";
  var isGrid=S.tab==="photo";
  wall.style.display=isGrid?"":"none";lg.style.display=isGrid?"none":"";
  var word,num;
  if(isGrid){LIST.forEach(function(p){wall.appendChild(cardEl(p))});word=LIST.length===1?"photograph":"photographs";num=LIST.length}
  else{
    var groups=S.tab==="location"?locs:subs;
    groups.forEach(function(g){
      var b=el("button","lc"+((S.tab==="location"&&S.loc===g.name)?" on":""));b.type="button";b.setAttribute("data-kind",S.tab);b.setAttribute("data-name",g.name);
      var img=document.createElement("img");img.src=g.photos[0].thumb;img.alt="";img.loading="lazy";b.appendChild(img);
      var t=el("span","lt",g.name);t.appendChild(el("span","ln",g.photos.length+(g.photos.length===1?" photograph":" photographs")));b.appendChild(t);lg.appendChild(b)});
    word=S.tab==="location"?(groups.length===1?"location":"locations"):(groups.length===1?"suburb":"suburbs");num=groups.length}
  if(!num){var d=el("div","empty");d.appendChild(el("b",null,"Nothing matches."));d.appendChild(document.createTextNode("Clear a filter or change the search."));em.appendChild(d)}
  var missing=DATA.filter(function(p){return !p._place&&pass(p,null)}).length;
  $("count").textContent=num+" "+word+(missing&&isGrid&&S.map?" \u00B7 "+missing+" not on the map":"");
  $("done").textContent="Show "+LIST.length+(LIST.length===1?" photograph":" photographs");
  $("ftoggle").setAttribute("aria-expanded",String(S.panel));
  $("mtoggle").textContent=S.map?"Grid":"Map";$("mtoggle").setAttribute("aria-pressed",String(S.map));
  $("dens").style.display=isGrid?"":"none";
  $("sortw").style.display=isGrid?"":"none";syncSort();
  document.body.classList.toggle("map",S.map);document.body.classList.toggle("panel",S.panel);
  $("panel").classList.toggle("open",S.panel);
  
  // Wyczyść wyszukiwarkę panelu po renderze
  if($("fsearch")) $("fsearch").value = "";
  
  layout();mapUpdate(true);save()}

/* ---------- search suggestions ---------- */
var SG=[],SGI=-1;
function buildSuggestions(q){
  var t=q.toLowerCase().split(/\s+/).filter(Boolean),out=[],seen={};
  function ok(label){var l=label.toLowerCase();return t.every(function(x){return l.indexOf(x)>-1})}
  function add(type,label,apply){var k=type+"|"+label;if(seen[k])return;seen[k]=1;out.push({type:type,label:label,apply:apply})}
  DATA.forEach(function(p){if(ok(p._loc))add("location",p._loc,function(){S.loc=p._loc})});
  VOC.suburb.forEach(function(s){if(ok(s))add("suburb",s,function(){S.f.suburb=[lc(s)]})});
  FACETS.forEach(function(F){if(F.key==="suburb"||F.key==="orientation"||F.key==="year")return;optionsFor(F).forEach(function(v){var c=canon(F.key,v);if(ok(c))add("keyword",c,function(){var a=(S.f[F.key]||[]).slice();if(a.indexOf(v)<0)a.push(v);S.f[F.key]=a})})});
  DATA.forEach(function(p){if(q.length>=4&&p.photoId&&ok(p.photoId))add("photo",p.photoId,function(){window.open(p.pageUrl,CFG.linkTarget)})});
  var rank={location:0,suburb:1,keyword:2,photo:3};
  out.sort(function(a,b){return rank[a.type]-rank[b.type]||a.label.localeCompare(b.label)});
  return out.slice(0,8)}

function showSug(){
  var h=$("sug");h.innerHTML="";
  if(!SG.length){h.classList.remove("open");return}
  SG.forEach(function(s,i){var d=el("div","sg"+(i===SGI?" on":""));d.setAttribute("role","option");d.appendChild(el("span",null,s.label));d.appendChild(el("span",null,s.type));
    d.addEventListener("mousedown",function(e){e.preventDefault();pickSug(s)});h.appendChild(d)});
  h.classList.add("open")}
function pickSug(s){SG=[];SGI=-1;showSug();$("q").value="";S.q="";s.apply();if(s.type==="location"||s.type==="suburb"||s.type==="keyword")S.tab="photo";render()}
function closeSug(){SG=[];SGI=-1;showSug()}

/* ---------- state & URL sync ---------- */
function syncUrl(){
  try{
    var p=new URLSearchParams();
    if(S.tab!=="photo")p.set("tab",S.tab);
    if(S.q)p.set("q",S.q);
    if(S.loc)p.set("loc",S.loc);
    if(S.sort!=="featured")p.set("sort",S.sort);
    if(S.cols)p.set("cols",String(S.cols));
    if(!S.map)p.set("map","0");
    FACETS.forEach(function(F){
      var v=selOf(F.key);if(v.length)p.set(F.key,v.join(","));
      if(S.mode[F.key])p.set(F.key+"_mode",S.mode[F.key]);
    });
    var qs=p.toString();
    var target=window.location.pathname+(qs?"?"+qs:"");
    if(window.location.search!==target.slice(window.location.pathname.length))window.history.replaceState(null,"",target);
  }catch(e){}
}

function save(){
  try{
    window.sessionStorage.setItem("pi_browse",JSON.stringify({tab:S.tab,q:S.q,loc:S.loc,f:S.f,mode:S.mode,sort:S.sort,cols:S.cols,map:S.map,y:$("main").scrollTop}));
    syncUrl();
  }catch(e){}
}

function restore(){
  try{
    var p=new URLSearchParams(window.location.search);
    var hasUrl=p.toString().length>0;
    if(hasUrl){
      if(p.get("tab"))S.tab=p.get("tab");
      if(p.get("q"))S.q=p.get("q");
      if(p.get("loc"))S.loc=p.get("loc");
      if(p.get("sort")&&SORTS.indexOf(p.get("sort"))>-1)S.sort=p.get("sort");
      if(p.get("cols"))S.cols=parseInt(p.get("cols"),10)||0;
      if(p.get("map")==="0")S.map=false;
      FACETS.forEach(function(F){
        var v=p.get(F.key);if(v)S.f[F.key]=v.split(",").map(lc).filter(Boolean);
        var m=p.get(F.key+"_mode");if(m)S.mode[F.key]=m;
      });
      $("q").value=S.q;
      return 0;
    }
    var r=JSON.parse(window.sessionStorage.getItem("pi_browse")||"null");if(!r)return 0;
    S.tab=r.tab||"photo";S.q=r.q||"";S.loc=r.loc||"";S.f=r.f||{};S.mode=r.mode||{};S.sort=SORTS.indexOf(r.sort)>-1?r.sort:"featured";S.cols=r.cols||0;if(typeof r.map==="boolean")S.map=r.map;
    $("q").value=S.q;return r.y||0
  }catch(e){return 0}
}

(function readParams(){
  if(window.innerWidth<900)S.map=false;
})();

/* ---------- events ---------- */
function on(id,ev,fn){if($(id))$(id).addEventListener(ev,fn)}
function wire(){
  on("ftoggle","click",function(){S.panel=!S.panel;render()});
  on("pclose","click",function(){S.panel=false;render()});
  on("done","click",function(){S.panel=false;render()});
  on("mtoggle","click",function(){S.map=!S.map;if(S.map){S.panel=false;ensureMap()}render();if(MAP)setTimeout(function(){MAP.resize()},60)});
  on("clear","click",function(){S.f={};S.loc="";render()});
  on("noteok","click",function(){try{window.localStorage.setItem("pi_map_note","1")}catch(e){}$("note").classList.remove("show")});
  
  /* Filter Quick Search - calls renderPanel directly */
  on("fsearch","input",function(){ renderPanel(); });

  buildSortMenu();
  on("sortbtn","click",function(){sortOpen(!$("sortlist").classList.contains("open"))});
  on("sortbtn","keydown",function(e){
    var open=$("sortlist").classList.contains("open"),k=e.key;
    if(k==="Escape"&&open){e.preventDefault();e.stopPropagation();sortOpen(false)}
    else if(k==="ArrowDown"||k==="ArrowUp"){e.preventDefault();if(!open)sortOpen(true);else{SORTI=(SORTI+(k==="ArrowDown"?1:-1)+SORTS.length)%SORTS.length;sortAct()}}
    else if(open&&(k==="Enter"||k===" ")){e.preventDefault();pickSort(SORTS[SORTI])}
    else if(open&&k==="Tab")sortOpen(false)});
  on("sortlist","mousedown",function(e){e.preventDefault()});
  on("sortlist","click",function(e){var o=e.target.closest&&e.target.closest(".so");if(o)pickSort(o.getAttribute("data-val"))});
  document.addEventListener("click",function(e){if(!e.target.closest||!e.target.closest("#sortw"))sortOpen(false)});
  on("dm","click",function(){var n=parseInt($("wall").getAttribute("data-n")||"3",10);S.cols=Math.max(1,n-1);layout();save()});
  on("dp","click",function(){var n=parseInt($("wall").getAttribute("data-n")||"3",10);S.cols=Math.min(6,n+1);layout();save()});
  on("chips","click",function(e){var b=e.target.closest&&e.target.closest("button");if(!b)return;var k=b.getAttribute("data-key"),v=b.getAttribute("data-val");if(k==="loc")S.loc="";else{S.f[k]=(S.f[k]||[]).filter(function(x){return x!==v})}render()});
  on("tabs","click",function(e){var b=e.target.closest&&e.target.closest("button");if(!b)return;S.tab=b.getAttribute("data-tab");render()});
  on("fgrid","click",function(e){var m=e.target.closest&&e.target.closest("[data-mkey]");if(m){S.mode[m.getAttribute("data-mkey")]=m.getAttribute("data-mval");render();return}var h=e.target.closest&&e.target.closest(".sh");if(!h)return;var k=h.getAttribute("data-sec"),cur=S.open[k]!==undefined?S.open[k]:selOf(k).length>0;S.open[k]=!cur;renderPanel()});
  on("fgrid","change",function(e){var i=e.target;if(i.getAttribute("data-key"))toggle(i.getAttribute("data-key"),i.getAttribute("data-val"))});
  on("locgrid","click",function(e){var b=e.target.closest&&e.target.closest(".lc");if(!b)return;var kind=b.getAttribute("data-kind"),name=b.getAttribute("data-name");
    if(kind==="location")S.loc=S.loc===name?"":name;else S.f.suburb=[lc(name)];S.tab="photo";render();$("main").scrollTop=0});
  var wall=$("wall");
  wall.addEventListener("mouseover",function(e){
    var c=e.target.closest&&e.target.closest(".card");
    var id = c&&c._p&&c._p._place?c._p._place.id:"";
    mapHot(id);
  });
  wall.addEventListener("mouseleave",function(){mapHot("")});
  wall.addEventListener("click",function(){save()});
  on("q","input",function(){var v=this.value.trim();clearTimeout(TQ);TQ=setTimeout(function(){S.q=v;render()},120);
    if(v.length<2){closeSug();return}SG=buildSuggestions(v);SGI=-1;showSug()});
  on("q","keydown",function(e){var open=$("sug").classList.contains("open");
    if(open&&e.key==="ArrowDown"){e.preventDefault();SGI=Math.min(SGI+1,SG.length-1);showSug()}
    else if(open&&e.key==="ArrowUp"){e.preventDefault();SGI=Math.max(SGI-1,0);showSug()}
    else if(open&&e.key==="Enter"&&SGI>-1){e.preventDefault();pickSug(SG[SGI])}
    else if(e.key==="Escape"){closeSug()}});
  on("q","blur",function(){setTimeout(closeSug,150)});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"){if(S.panel){S.panel=false;render()}else if(S.loc){S.loc="";render()}}});
  var rt=null;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){layout();if(MAP)MAP.resize()},150)});
  window.addEventListener("pagehide",save);
  if(window.ResizeObserver)new ResizeObserver(function(){layout()}).observe($("main"));
  window.__pi={S:S,render:render,get data(){return DATA},get list(){return LIST}}}

/* ---------- init ---------- */
function fail(msg){$("count").textContent=msg}
function init(){
  wire();
  var y=restore();
  Promise.all([
    fetch(CFG.photosUrl).then(function(r){if(!r.ok)throw new Error("photos HTTP "+r.status);return r.json()}),
    fetch(CFG.locationsUrl).then(function(r){return r.ok?r.text():""}).catch(function(){return ""})
  ]).then(function(res){
    DATA=(Array.isArray(res[0])?res[0]:[]).filter(function(p){return p&&p.pageUrl&&p.thumb});
    if(!DATA.length)throw new Error("empty");
    PLACES=loadPlaces(res[1]);prep();render();
    if(S.map)ensureMap();
    if(y)setTimeout(function(){$("main").scrollTop=y},60)
  }).catch(function(){fail("The archive could not be loaded. Please try again in a moment.")})}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
